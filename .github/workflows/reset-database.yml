name: Reset database (usage unique, destructif)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Doit valoir exactement: yes-reset-entire-database"
        required: true

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Run reset
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CONFIRM: ${{ inputs.confirm }}
        run: node scripts/reset-database.js
